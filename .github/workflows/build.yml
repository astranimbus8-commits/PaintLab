name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PaintLab.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Download scene model
        working-directory: PaintLab
        run: |
          pip install --quiet kagglehub || true
          python3 scripts/fetch_scene_model.py
      - name: Build APK
        working-directory: PaintLab
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: PaintLab/app/build/outputs/apk/release/app-release.apk
